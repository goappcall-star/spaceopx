name: LobbyX Desktop Release
on:
  workflow_dispatch:
    inputs:
      web_validated:
        description: "WEB validated in production and draft installer preparation authorized"
        required: true
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.web_validated == true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Validate tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match desktop version' }
      - run: node --test --test-concurrency=1 tests/*.test.mjs
      - run: npx tsc --noEmit
      - name: Build installer and update metadata
        run: npm run desktop:dist
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
      - name: Prepare private draft only (no automatic update publication)
        run: npm run desktop:release
        env:
          GH_TOKEN: ${{ github.token }}
